  test-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0700" }
  ldap-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=101,mode=0750" }
  ldap-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=101,mode=0700" }
  valkey-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0750" }
  valkey-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0700" }
  idp-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=0,mode=0750" }
  idp-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=0,mode=0700" }
  worker-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0750" }
