# Single source of the service topology (ADR 0001). Quadlet units under
# deploy/quadlet/ are generated from this file with scripts/quadlet.sh.
#
# Conventions this file keeps so the generated units work:
# - every service sets container_name, because Quadlet otherwise names
#   containers systemd-<name> and service-name DNS stops resolving;
# - no restart policies: they are production drop-ins (ADR 0001);
# - `build:` is local only and is stripped before generation;
# - third-party images are pinned by digest alone (podlet rejects tag@digest),
#   with the version in a trailing comment;
# - depends_on is always written in map form;
# - services whose production counterpart is external or different (ADR
#   0001, 0002) carry the `local` profile, test runners the `test` profile.
#   Neither reaches the generated units, and scripts/stack.sh always runs
#   with --profile local;
# - the `dev` profile holds the Vite dev server (ADR 0014), started by
#   `scripts/stack.sh up --dev`, which also sets NGINX_WEB_UPSTREAM. Values
#   interpolated from the environment are local-only by the same rule and
#   are dropped from the generated units.
# - the product's identity (ADR 0035) comes from product.env, which the
#   scripts export: ${PRODUCT} names the project, the local images and
#   containers (<project>-<service>, so several products' stacks run side by
#   side) and the local host names (app.<project>.localhost);
#   ${PRODUCT_HTTPS_PORT} and ${PRODUCT_HTTP_PORT} are the published ports,
#   ${PRODUCT_DISPLAY_NAME} what people read. scripts/quadlet.sh writes their
#   values into the generated units and drops the prefix from the container
#   names, which stay per user in production. Without them nothing starts.
name: ${PRODUCT:?run the stack through scripts/stack.sh, which reads product.env}

services:
  certs:
    build:
      context: .
      dockerfile: containers/certs/Containerfile
    image: localhost/${PRODUCT:?}-certs:dev
    container_name: ${PRODUCT:?}-certs
    profiles: [local]
    environment:
      # The root's name, given once when it is created (ADR 0035).
      CA_NAME: ${PRODUCT_DISPLAY_NAME:?} local CA
      CERT_HOSTNAMES: app.${PRODUCT:?}.localhost,e2e.${PRODUCT:?}.localhost,idp.${PRODUCT:?}.localhost,dozzle.${PRODUCT:?}.localhost,grafana.${PRODUCT:?}.localhost,mail.${PRODUCT:?}.localhost,netbox.${PRODUCT:?}.localhost
    network_mode: none
    volumes:
      - certs-ca:/ca
      - trust:/trust
      - tls-nginx:/tls/nginx
      - tls-openbao:/tls/openbao
      - tls-postgres:/tls/postgres
      - tls-pgbouncer:/tls/pgbouncer
      - tls-ldap:/tls/ldap
      - tls-valkey:/tls/valkey
      - tls-s3:/tls/s3
      - tls-api:/tls/api
      - tls-worker:/tls/worker
      - tls-prometheus:/tls/prometheus
      - tls-loki:/tls/loki
      - tls-grafana:/tls/grafana
      - tls-mail:/tls/mail
      - tls-blackbox:/tls/blackbox
      - tls-postgres-exporter:/tls/postgres-exporter
      - tls-pgbouncer-exporter:/tls/pgbouncer-exporter
      - tls-valkey-exporter:/tls/valkey-exporter
      - tls-node-exporter:/tls/node-exporter
      - tls-netbox:/tls/netbox

  nginx:
    build:
      context: .
      dockerfile: containers/nginx/Containerfile
    image: localhost/${PRODUCT:?}-nginx:dev
    container_name: ${PRODUCT:?}-nginx
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_TLS_DIR: /etc/nginx/tls
      NGINX_APP_HOST: app.${PRODUCT:?}.localhost
      # The local IdP (ADR 0008), Dozzle (ADR 0002) and Mailpit's inbox
      # (ADR 0022) are local only, like the e2e origin below: interpolated
      # values never reach the production units, so production has none of
      # these virtual hosts unless a drop-in sets one on purpose.
      NGINX_IDP_HOST: ${NGINX_IDP_HOST:-idp.${PRODUCT:?}.localhost}
      NGINX_PUBLIC_PORT: "${PRODUCT_HTTPS_PORT:?}"
      # Plain HTTP, which only redirects to HTTPS (ADR 0016); production
      # publishes it as port 80.
      NGINX_HTTP_PORT: "${PRODUCT_HTTP_PORT:?}"
      # Mirrored in bytes as the api's BODY_SIZE_CEILING_BYTES (ADR 0025).
      NGINX_BODY_SIZE_LIMIT: 10m
      NGINX_API_UPSTREAM: api:3030
      # The e2e origin (ADR 0015), local only: interpolated values never
      # reach the production units.
      NGINX_E2E_HOST: ${NGINX_E2E_HOST:-e2e.${PRODUCT:?}.localhost}
      NGINX_E2E_API_UPSTREAM: ${NGINX_E2E_API_UPSTREAM:-api-e2e:3030}
      NGINX_IDP_UPSTREAM: ${NGINX_IDP_UPSTREAM:-idp:8080}
      NGINX_DOZZLE_HOST: ${NGINX_DOZZLE_HOST:-dozzle.${PRODUCT:?}.localhost}
      NGINX_DOZZLE_UPSTREAM: ${NGINX_DOZZLE_UPSTREAM:-dozzle:8080}
      # Grafana in every environment, Mailpit's inbox locally (ADR 0022);
      # production sets its own Grafana host name and no mail host.
      NGINX_GRAFANA_HOST: grafana.${PRODUCT:?}.localhost
      NGINX_GRAFANA_UPSTREAM: grafana:3000
      NGINX_MAIL_HOST: ${NGINX_MAIL_HOST:-mail.${PRODUCT:?}.localhost}
      NGINX_MAIL_UPSTREAM: ${NGINX_MAIL_UPSTREAM:-mail:8025}
      # NetBox (ADR 0031) in every environment; production sets its host.
      NGINX_NETBOX_HOST: netbox.${PRODUCT:?}.localhost
      NGINX_NETBOX_UPSTREAM: netbox:8443
      # Empty: serve the built bundle. `up --dev`: the dev server.
      NGINX_WEB_UPSTREAM: ${NGINX_WEB_UPSTREAM:-}
    ports:
      # Nginx listens on the public port itself, so inside the networks
      # nginx on that port is the same origin a browser uses (the e2e
      # container).
      - "127.0.0.1:${PRODUCT_HTTPS_PORT:?}:${PRODUCT_HTTPS_PORT:?}"
      - "127.0.0.1:${PRODUCT_HTTP_PORT:?}:${PRODUCT_HTTP_PORT:?}"
    networks:
      edge:
        # The public name, for clients inside the stack: the uptime probe
        # reaches the same origin a browser does (ADR 0022).
        aliases: ["app.${PRODUCT:?}.localhost"]
      idp-edge: {}
      dozzle-edge: {}
      grafana-edge: {}
      mail-edge: {}
      mcp-edge: {}
      netbox-edge: {}
    volumes:
      - tls-nginx:/etc/nginx/tls:ro
      - trust:/trust:ro

  # The Vite dev server with the frontend source bind-mounted (ADR 0014).
  # Nginx proxies to it when NGINX_WEB_UPSTREAM is set; origin, TLS and
  # headers stay those of production.
  web:
    build:
      context: .
      dockerfile: containers/nginx/Containerfile
      target: web-dev
    image: localhost/${PRODUCT:?}-web-dev:dev
    container_name: ${PRODUCT:?}-web
    profiles: [dev]
    environment:
      PUBLIC_HOST: app.${PRODUCT:?}.localhost
      PUBLIC_PORT: "${PRODUCT_HTTPS_PORT:?}"
    networks: [edge]
    volumes:
      - ./apps/web/src:/repo/apps/web/src:ro,Z
      - ./apps/web/public:/repo/apps/web/public:ro,Z
      - ./apps/web/index.html:/repo/apps/web/index.html:ro,Z
      - ./apps/web/quasar.config.ts:/repo/apps/web/quasar.config.ts:ro,Z

  api:
    build:
      context: .
      dockerfile: containers/api/Containerfile
      target: runtime
      # Set by scripts/stack.sh from git (ADR 0032).
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_COMMIT_TIME: ${APP_COMMIT_TIME:-unknown}
        APP_DIRTY: ${APP_DIRTY:-false}
    image: localhost/${PRODUCT:?}-api:dev
    container_name: ${PRODUCT:?}-api
    # The api refuses to start before migrate has seeded the runtime
    # settings (ADR 0025).
    # Beside the start condition, what it keeps a connection to while it
    # runs: `required: false`, an order and no binding, Wants= and After=
    # in the generated unit (ADR 0002).
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
        required: false
      valkey:
        condition: service_started
        required: false
      s3:
        condition: service_started
        required: false
    environment: &api-environment
      # The one public address of the app: every link it hands out, the
      # Origin check, the token audience and the SAML entity ID (ADR 0016).
      # Defined once here; the worker and scripts/stack.sh take it from this
      # line. The IdP realm (containers/idp/realm-feathers.json) and the
      # uptime probe (containers/prometheus/targets/uptime.yml) build it
      # from the same product.env.
      PUBLIC_ORIGIN: &public-origin https://app.${PRODUCT:?}.localhost:${PRODUCT_HTTPS_PORT:?}
      # The product's display name (ADR 0035), in mail.
      APP_NAME: &app-name ${PRODUCT_DISPLAY_NAME:?}
      # Rotated JSON log files, read by the collector (ADR 0021).
      LOG_FILE: /var/log/app/api
      # Metrics and health on the internal port, over TLS (ADR 0022).
      INTERNAL_TLS_CERT_FILE: /tls/tls.crt
      INTERNAL_TLS_KEY_FILE: /tls/tls.key
      AUTH_SIGNING_SECRET_FILE: /run/secrets/auth_signing_secret
      REFRESH_TOKEN_KEY_FILE: /run/secrets/refresh_token_key
      SAML_SP_PRIVATE_KEY_FILE: /run/secrets/saml_sp_key
      SAML_SP_CERTIFICATE_FILE: /run/secrets/saml_sp_cert
      SAML_IDP_CERTIFICATE_FILE: /run/secrets/saml_idp_cert
      SAML_IDP_ENTITY_ID: https://idp.${PRODUCT:?}.localhost:${PRODUCT_HTTPS_PORT:?}/realms/feathers
      SAML_IDP_SSO_URL: https://idp.${PRODUCT:?}.localhost:${PRODUCT_HTTPS_PORT:?}/realms/feathers/protocol/saml
      SAML_IDP_SLO_URL: https://idp.${PRODUCT:?}.localhost:${PRODUCT_HTTPS_PORT:?}/realms/feathers/protocol/saml
      DATABASE_HOST: pgbouncer
      DATABASE_PORT: "6432"
      DATABASE_NAME: app
      DATABASE_USER: app
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_CA_FILE: /trust/ca.crt
      # Nginx's NGINX_BODY_SIZE_LIMIT (10m) in bytes.
      BODY_SIZE_CEILING_BYTES: "10485760"
      VALKEY_HOST: valkey
      VALKEY_USER: api
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      VALKEY_CA_FILE: /trust/ca.crt
      # X-Forwarded-For is believed only from this container (ADR 0016).
      TRUSTED_PROXY_HOST: nginx
      # Directory lookup (ADR 0008); the university directory in production.
      LDAP_URL: ldaps://ldap:636
      LDAP_BIND_DN: cn=api,ou=services,dc=feathers,dc=test
      LDAP_BIND_PASSWORD_FILE: /run/secrets/ldap_bind_password
      LDAP_BASE_DN: ou=people,dc=feathers,dc=test
      LDAP_CA_FILE: /trust/ca.crt
      # Object storage (ADR 0020), over TLS to the s3 container's Nginx.
      S3_ENDPOINT: https://s3:3900
      S3_KEY_ID_FILE: /run/secrets/s3_key_id
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_CA_FILE: /trust/ca.crt
      # Locations (ADR 0031): NetBox's REST API with a read-only v2 token,
      # its key here and its secret from OpenBao.
      NETBOX_URL: https://netbox:8443
      NETBOX_PUBLIC_URL: &netbox-public-url https://netbox.${PRODUCT:?}.localhost:${PRODUCT_HTTPS_PORT:?}
      NETBOX_TOKEN_KEY: &netbox-token-key feathersapi1
      NETBOX_TOKEN_FILE: /run/secrets/netbox_token
      NETBOX_CA_FILE: /trust/ca.crt
      # System info (ADR 0032): the running versions from Prometheus.
      PROMETHEUS_URL: https://prometheus:9090
      PROMETHEUS_CA_FILE: /trust/ca.crt
    networks: [edge, app-data, identity, object, observability, netbox-api]
    volumes:
      - api-secrets:/run/secrets:ro
      - trust:/trust:ro
      - logs:/var/log/app
      - tls-api:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "NODE_EXTRA_CA_CERTS=/trust/ca.crt node -e \"fetch('https://localhost:9090/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3

  # The api of the end-to-end suite (ADR 0015): the same image and
  # configuration on a database of its own, `app_e2e`, behind its own origin,
  # so a Playwright run never touches the data of the local `app`.
  # `scripts/stack.sh e2e` recreates the database, starts this container for
  # the run and removes it afterwards.
  api-e2e:
    image: localhost/${PRODUCT:?}-api:dev
    container_name: ${PRODUCT:?}-api-e2e
    profiles: [test]
    environment:
      <<: *api-environment
      PUBLIC_ORIGIN: https://e2e.${PRODUCT:?}.localhost:${PRODUCT_HTTPS_PORT:?}
      DATABASE_NAME: app_e2e
      RATE_LIMIT_PREFIX: rl:e2e
      # Emptied by every `stack.sh e2e`, as app_e2e is recreated.
      S3_UPLOADS_BUCKET: e2e-uploads
      S3_EXPORTS_BUCKET: e2e-exports
      # Its exports go to worker-e2e, not to the local worker (ADR 0024).
      QUEUE_PREFIX: bull:e2e
      # Like worker-e2e's: the suite never reaches the internet (ADR 0032).
      UPDATE_CHECK: "off"
      # Stdout only: its lines stay out of Loki and the alert rules.
      LOG_FILE: ""
    # `observability` for Prometheus, where the system-info page reads the
    # running versions (ADR 0032).
    networks: [edge, app-data, identity, object, observability, netbox-api]
    volumes:
      - api-secrets:/run/secrets:ro
      - trust:/trust:ro
      - tls-api:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "NODE_EXTRA_CA_CERTS=/trust/ca.crt node -e \"fetch('https://localhost:9090/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3

  # Background jobs (ADR 0024): the api's image, another entry point, and
  # credentials of its own.
  worker:
    image: localhost/${PRODUCT:?}-api:dev
    container_name: ${PRODUCT:?}-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
        required: false
      valkey:
        condition: service_started
        required: false
      s3:
        condition: service_started
        required: false
    command: ["node", "dist/worker.js"]
    environment: &worker-environment
      LOG_FILE: /var/log/app/worker
      INTERNAL_TLS_CERT_FILE: /tls/tls.crt
      INTERNAL_TLS_KEY_FILE: /tls/tls.key
      DATABASE_HOST: pgbouncer
      DATABASE_PORT: "6432"
      DATABASE_NAME: app
      DATABASE_USER: worker
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_CA_FILE: /trust/ca.crt
      VALKEY_HOST: valkey
      VALKEY_USER: worker
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      VALKEY_CA_FILE: /trust/ca.crt
      S3_ENDPOINT: https://s3:3900
      S3_KEY_ID_FILE: /run/secrets/s3_key_id
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_CA_FILE: /trust/ca.crt
      # Mail (ADR 0027): Mailpit locally, the university relay in production;
      # links in mail start with the public origin, the sender is named by
      # the display name.
      PUBLIC_ORIGIN: *public-origin
      APP_NAME: *app-name
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_CA_FILE: /trust/ca.crt
      MAIL_FROM: noreply@app.${PRODUCT:?}.localhost
      # System info (ADR 0032): the host's OS version from Prometheus, and
      # the daily check for newer versions, the one request to the internet.
      PROMETHEUS_URL: https://prometheus:9090
      PROMETHEUS_CA_FILE: /trust/ca.crt
      UPDATE_CHECK: "on"
    networks: [app-data, object, observability]
    volumes:
      - worker-secrets:/run/secrets:ro
      - trust:/trust:ro
      - logs:/var/log/app
      - tls-worker:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "NODE_EXTRA_CA_CERTS=/trust/ca.crt node -e \"fetch('https://localhost:9090/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3

  # The worker of the end-to-end suite (ADR 0015): builds api-e2e's exports
  # (ADR 0013) from app_e2e and its buckets, under a queue prefix of their
  # own. `scripts/stack.sh e2e` starts it with api-e2e and removes it after.
  worker-e2e:
    image: localhost/${PRODUCT:?}-api:dev
    container_name: ${PRODUCT:?}-worker-e2e
    profiles: [test]
    command: ["node", "dist/worker.js"]
    environment:
      <<: *worker-environment
      DATABASE_NAME: app_e2e
      QUEUE_PREFIX: bull:e2e
      S3_UPLOADS_BUCKET: e2e-uploads
      S3_EXPORTS_BUCKET: e2e-exports
      PUBLIC_ORIGIN: https://e2e.${PRODUCT:?}.localhost:${PRODUCT_HTTPS_PORT:?}
      # Stdout only: its lines stay out of Loki and the alert rules.
      LOG_FILE: ""
      # The suite never reaches the internet (ADR 0032).
      UPDATE_CHECK: "off"
    # `observability` for Mailpit, where the suite finds its mail (ADR 0027).
    networks: [app-data, object, observability]
    volumes:
      - worker-secrets:/run/secrets:ro
      - trust:/trust:ro
      - tls-worker:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "NODE_EXTRA_CA_CERTS=/trust/ca.crt node -e \"fetch('https://localhost:9090/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3

  # Backups (ADR 0017): restic repositories under /srv/backups, which is a
  # named volume locally and the host's NFS mount when BACKUP_TARGET names
  # it (CI); the production unit mounts /srv/backups (scripts/quadlet.sh).
  # Only on db, object and secrets (ADR 0002). Valkey's snapshot is read
  # from its volume, never over the network.
  backup:
    build:
      context: .
      dockerfile: containers/api/Containerfile
      target: backup
    image: localhost/${PRODUCT:?}-backup:dev
    container_name: ${PRODUCT:?}-backup
    # restic's locks name the host; a fixed name lets a restarted container
    # recognise its own stale ones.
    hostname: backup
    # It refuses to start without its runtime settings (ADR 0025).
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_started
        required: false
      s3:
        condition: service_started
        required: false
    environment:
      LOG_FILE: /var/log/app/backup/backup
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: app
      DATABASE_USER: backup
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_CA_FILE: /trust/ca.crt
      S3_ENDPOINT: https://s3:3900
      S3_KEY_ID_FILE: /run/secrets/s3_key_id
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_CA_FILE: /trust/ca.crt
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      OPENBAO_ADDR: https://openbao:8200
      OPENBAO_TOKEN_FILE: /run/secrets/openbao_token
      OPENBAO_CA_FILE: /trust/ca.crt
    networks: [db, object, secrets]
    volumes:
      - ${BACKUP_TARGET:-backups}:/srv/backups
      - backup-data:/var/lib/backup
      - valkey-data:/var/lib/valkey:ro
      - backup-secrets:/run/secrets:ro
      - trust:/trust:ro
      - logs:/var/log/app

  migrate:
    image: localhost/${PRODUCT:?}-api:dev
    container_name: ${PRODUCT:?}-migrate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: app
      DATABASE_USER: migrator
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_CA_FILE: /trust/ca.crt
    networks: [db]
    volumes:
      - migrate-secrets:/run/secrets:ro
      - trust:/trust:ro

  # Locations (ADR 0031): NetBox, the register of the university's sites
  # (buildings) and, inside them, locations (rooms). Browsers reach it
  # through Nginx under its own host name, the api on netbox-api; its
  # database through PgBouncer and Valkey as a user of its own, on
  # netbox-data, which holds nothing else of the application.
  netbox:
    build:
      context: .
      dockerfile: containers/netbox/Containerfile
    image: localhost/${PRODUCT:?}-netbox:dev
    container_name: ${PRODUCT:?}-netbox
    depends_on:
      netbox-setup:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
        required: false
      valkey:
        condition: service_started
        required: false
    environment: &netbox-environment
      NETBOX_HOST: netbox.${PRODUCT:?}.localhost
      NETBOX_PUBLIC_ORIGIN: *netbox-public-url
      NETBOX_CONTACT_EMAIL: operators@app.${PRODUCT:?}.localhost
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_NAME: netbox
      DB_USER: netbox
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_USERNAME: netbox
      # No local superuser: people log in through the IdP (ADR 0031).
      SKIP_SUPERUSER: "true"
      SAML_IDP_ENTITY_ID: https://idp.${PRODUCT:?}.localhost:${PRODUCT_HTTPS_PORT:?}/realms/feathers
      SAML_IDP_SSO_URL: https://idp.${PRODUCT:?}.localhost:${PRODUCT_HTTPS_PORT:?}/realms/feathers/protocol/saml
      # The IdP's group attribute; members of these groups are superusers.
      NETBOX_SAML_GROUPS_ATTRIBUTE: groups
      NETBOX_SAML_SUPERUSER_GROUPS: netbox-admins
      NETBOX_TOKEN_KEY: *netbox-token-key
      # TLS on its own listener (ADR 0016), a leaf of its own.
      GRANIAN_PORT: "8443"
      GRANIAN_WORKERS: "2"
      GRANIAN_SSL_CERTIFICATE: /tls/tls.crt
      GRANIAN_SSL_KEYFILE: /tls/tls.key
    networks: [netbox-edge, netbox-api, netbox-data]
    volumes:
      - netbox-secrets:/run/secrets:ro
      - netbox-media:/opt/netbox/netbox/media
      - tls-netbox:/tls:ro
      - trust:/trust:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert /trust/ca.crt -o /dev/null https://localhost:8443/login/"]
      interval: 10s
      timeout: 5s
      retries: 30

  # NetBox's background jobs and its housekeeping.
  netbox-worker:
    image: localhost/${PRODUCT:?}-netbox:dev
    container_name: ${PRODUCT:?}-netbox-worker
    depends_on:
      netbox-setup:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
        required: false
      valkey:
        condition: service_started
        required: false
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker", "high", "default", "low"]
    environment: *netbox-environment
    networks: [netbox-data]
    volumes:
      - netbox-secrets:/run/secrets:ro
      - netbox-media:/opt/netbox/netbox/media
      - trust:/trust:ro

  # NetBox's migrations, over a direct connection like migrate (ADR 0004),
  # then the seed from the files baked into the image (ADR 0031).
  netbox-setup:
    image: localhost/${PRODUCT:?}-netbox:dev
    container_name: ${PRODUCT:?}-netbox-setup
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["bash", "/opt/feathers/setup.sh"]
    environment:
      <<: *netbox-environment
      DB_HOST: postgres
      DB_PORT: "5432"
    networks: [db, netbox-data]
    volumes:
      - netbox-secrets:/run/secrets:ro
      - trust:/trust:ro

  postgres:
    image: docker.io/library/postgres@sha256:d8703cd7fba306b9fec9268ecedfa8a966846c053036a60e3635791957eb2f66 # 18.6-alpine
    container_name: ${PRODUCT:?}-postgres
    # The image's entry point, plus roles.sh on every start (ADR 0003).
    entrypoint: ["bash", "/usr/local/share/postgres/entrypoint.sh"]
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/tls.crt
      - -c
      - ssl_key_file=/tls/tls.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=100
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/superuser_password
      PGDATA: /var/lib/postgresql/data/pgdata
    networks: [db]
    # The image declares VOLUME /var/lib/postgresql, above the data volume;
    # left uncovered, every recreate would leave an anonymous volume behind
    # (scripts/prune.sh, ADR 0015).
    tmpfs: [/var/lib/postgresql]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-secrets:/run/secrets:ro
      - tls-postgres:/tls:ro
      - ./containers/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,Z
      - ./containers/postgres/initdb:/docker-entrypoint-initdb.d:ro,Z
      - ./containers/postgres/entrypoint.sh:/usr/local/share/postgres/entrypoint.sh:ro,Z
      - ./containers/postgres/roles.sh:/usr/local/share/postgres/roles.sh:ro,Z
    healthcheck:
      # Over TCP, the way clients connect: during first initialisation the
      # image runs a temporary server on the Unix socket only, which a socket
      # probe would report as ready (and systemd trusts this via
      # Notify=healthy). Healthy only once the roles are applied.
      test: ["CMD-SHELL", "gosu postgres pg_isready -q -h 127.0.0.1 && test -e /run/postgresql/roles-applied"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    build:
      context: .
      dockerfile: containers/pgbouncer/Containerfile
    image: localhost/${PRODUCT:?}-pgbouncer:dev
    container_name: ${PRODUCT:?}-pgbouncer
    # Safe shutdown: running transactions finish, then it exits. On SIGTERM
    # PgBouncer 1.23+ waits for every client to disconnect, which ran into
    # Podman's SIGKILL whenever a client outlived the stop (ADR 0004).
    stop_signal: SIGINT
    depends_on:
      postgres:
        condition: service_started
    networks: [app-data, db, netbox-data]
    volumes:
      - pgbouncer-secrets:/run/secrets:ro
      - tls-pgbouncer:/tls:ro
      - trust:/trust:ro

  valkey:
    image: docker.io/valkey/valkey@sha256:3b83b0b6a598bb390c8186a408a69949772f439548a81c5ea0ab7ccf102c248d # 9.1.2-alpine
    container_name: ${PRODUCT:?}-valkey
    depends_on:
      certs:
        condition: service_completed_successfully
    # Files group-readable: the backup service reads the RDB snapshot through
    # Valkey's group (ADR 0017). The image's entry point keeps a umask it
    # did not default to.
    entrypoint: ["sh", "-c", "umask 0027 && exec docker-entrypoint.sh \"$$@\"", "valkey"]
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    networks: [app-data, netbox-data]
    volumes:
      - ./containers/valkey/valkey.conf:/etc/valkey/valkey.conf:ro,Z
      - valkey-data:/data
      - valkey-secrets:/run/secrets:ro
      - tls-valkey:/tls:ro
      - trust:/trust:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/probe_password)\" valkey-cli --user probe --tls --cacert /trust/ca.crt -h valkey ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage (ADR 0020): Garage behind Nginx for TLS, one image. The
  # buckets and each client's key are set up by the container at every start,
  # from keys its agent renders.
  s3:
    build:
      context: .
      dockerfile: containers/s3/Containerfile
    image: localhost/${PRODUCT:?}-s3:dev
    container_name: ${PRODUCT:?}-s3
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      # Local only (interpolated, so never in the generated units): the
      # buckets of the test runs, emptied by each run (ADR 0015, 0020), and
      # the source and target of the backup-and-restore check (ADR 0017).
      S3_LOCAL_GRANTS: ${S3_LOCAL_GRANTS:-api:e2e-uploads:write api:e2e-exports:write worker:e2e-uploads:write worker:e2e-exports:write test:test-uploads:write test:test-purge:write test:test-exports:write test:test-data-exports:write backup:backup-check:read backup:restore-check:read}
    networks: [object, observability]
    volumes:
      - s3-data:/var/lib/garage
      - s3-secrets:/run/secrets:ro
      - tls-s3:/tls:ro
      - trust:/trust:ro
    healthcheck:
      test: ["CMD-SHELL", "test -e /run/garage/bootstrapped && curl -fsS --cacert /trust/ca.crt https://localhost:3903/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  test:
    build:
      context: .
      dockerfile: containers/api/Containerfile
      target: test
    image: localhost/${PRODUCT:?}-api-test:dev
    container_name: ${PRODUCT:?}-test
    profiles: [test]
    environment:
      DATABASE_HOST: pgbouncer
      DATABASE_PORT: "6432"
      DATABASE_NAME: postgres
      DATABASE_USER: test
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_CA_FILE: /trust/ca.crt
      DATABASE_POOL_MAX: "2"
      VALKEY_HOST: valkey
      VALKEY_USER: test
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      VALKEY_CA_FILE: /trust/ca.crt
      LDAP_URL: ldaps://ldap:636
      LDAP_BIND_DN: cn=api,ou=services,dc=feathers,dc=test
      LDAP_BIND_PASSWORD_FILE: /run/secrets/ldap_bind_password
      LDAP_BASE_DN: ou=people,dc=feathers,dc=test
      LDAP_CA_FILE: /trust/ca.crt
      S3_ENDPOINT: https://s3:3900
      S3_KEY_ID_FILE: /run/secrets/s3_key_id
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_CA_FILE: /trust/ca.crt
      S3_UPLOADS_BUCKET: test-uploads
      S3_EXPORTS_BUCKET: test-exports
      # Sending through Mailpit (ADR 0027).
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_CA_FILE: /trust/ca.crt
      MAIL_FROM: noreply@test.${PRODUCT:?}.localhost
      APP_NAME: *app-name
      # The seeded NetBox, read only (ADR 0031).
      NETBOX_URL: https://netbox:8443
      NETBOX_PUBLIC_URL: *netbox-public-url
      NETBOX_TOKEN_KEY: *netbox-token-key
      NETBOX_TOKEN_FILE: /run/secrets/netbox_token
      NETBOX_CA_FILE: /trust/ca.crt
      # The stack's Prometheus (ADR 0032); the update check's sources are
      # faked in the tests, never the internet.
      PROMETHEUS_URL: https://prometheus:9090
      PROMETHEUS_CA_FILE: /trust/ca.crt
      UPDATE_CHECK: "off"
      # What the seeded roles grant by default is checked only in the
      # skeleton itself (ADR 0035).
      PRODUCT: ${PRODUCT:?}
    networks: [app-data, identity, object, observability, netbox-api]
    volumes:
      - test-secrets:/run/secrets:ro
      - trust:/trust:ro

  ldap:
    build:
      context: .
      dockerfile: containers/ldap/Containerfile
    image: localhost/${PRODUCT:?}-ldap:dev
    container_name: ${PRODUCT:?}-ldap
    profiles: [local]
    depends_on:
      certs:
        condition: service_completed_successfully
    networks: [identity]
    volumes:
      - ldap-data:/var/lib/openldap
      - ldap-secrets:/run/secrets:ro
      - tls-ldap:/tls:ro

  idp:
    build:
      context: .
      dockerfile: containers/idp/Containerfile
    image: localhost/${PRODUCT:?}-idp:dev
    container_name: ${PRODUCT:?}-idp
    profiles: [local]
    depends_on:
      ldap:
        condition: service_started
    environment:
      KC_HOSTNAME: https://idp.${PRODUCT:?}.localhost:${PRODUCT_HTTPS_PORT:?}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_TRUSTSTORE_PATHS: /trust/ca.crt
      # The realm's client URLs (containers/idp/realm-feathers.json) name
      # these as placeholders, which Keycloak fills in on import (ADR 0035).
      PRODUCT: ${PRODUCT:?}
      PRODUCT_HTTPS_PORT: ${PRODUCT_HTTPS_PORT:?}
    networks: [idp-edge, identity]
    volumes:
      - idp-data:/opt/keycloak/data/h2
      - idp-secrets:/run/secrets:ro
      - trust:/trust:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Local convenience only (ADR 0002): a live view of container output at
  # https://dozzle.<project>.localhost. Not part of the log pipeline (ADR 0021,
  # 0022), which reads the log files, not container output.
  dozzle:
    image: docker.io/amir20/dozzle@sha256:cca4da41d490960e0ccc07e7c86d9aa57022a8fac516089ff9a9419f589dd5e5 # v11.1.3
    container_name: ${PRODUCT:?}-dozzle
    profiles: [local]
    environment:
      DOZZLE_FILTER: label=com.docker.compose.project=${PRODUCT:?}
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_RELEASE_CHECK_MODE: manual
      DOZZLE_IMAGE_CHECK_MODE: "off"
    networks: [dozzle-edge]
    # The rootless Podman API socket (systemctl --user enable --now
    # podman.socket). A socket cannot be mounted read-only in any useful
    # sense: whoever reaches it controls the user's containers, which is
    # accepted for a local-only tool behind 127.0.0.1. SELinux hosts need
    # the label disabled to connect to it.
    security_opt: [label=disable]
    volumes:
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

  e2e:
    build:
      context: .
      dockerfile: containers/e2e/Containerfile
    image: localhost/${PRODUCT:?}-e2e:dev
    container_name: ${PRODUCT:?}-e2e
    profiles: [test]
    environment:
      # The e2e origin, served by api-e2e on its own database (ADR 0015).
      E2E_APP_ORIGIN: https://e2e.${PRODUCT:?}.localhost:${PRODUCT_HTTPS_PORT:?}
      # Nginx's plain HTTP port, which only redirects (ADR 0016).
      E2E_HTTP_PORT: ${PRODUCT_HTTP_PORT:?}
      # Chromium resolves *.localhost to loopback; map the public names to
      # nginx instead (ADR 0015).
      E2E_HOST_RESOLVER_RULES: MAP e2e.${PRODUCT:?}.localhost nginx, MAP idp.${PRODUCT:?}.localhost nginx, MAP mail.${PRODUCT:?}.localhost nginx, MAP netbox.${PRODUCT:?}.localhost nginx
      # The e2e database's break-glass account (ADR 0008), made by
      # `stack.sh e2e` for the run; a local test value, never a real one.
      E2E_BREAKGLASS_EMAIL: breakglass@e2e.${PRODUCT:?}.localhost
      E2E_BREAKGLASS_PASSWORD: ${E2E_BREAKGLASS_PASSWORD:-}
    # The container networks are IPv4 only. Link-local IPv6 addresses still
    # appear, and settle, just after start; Chromium reports that as a
    # network change and aborts the request in flight (ERR_NETWORK_CHANGED),
    # which failed the first test of a run intermittently.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    networks: [edge, idp-edge]
    volumes:
      - trust:/trust:ro

  # The browser a coding agent drives (ADR 0026): the e2e image, idle until
  # an agent starts the Playwright MCP server in it with `podman exec -i`
  # (.mcp.json). Its only network is internal and holds nothing but Nginx,
  # so the browser reaches the local origins and not the internet.
  mcp-browser:
    build:
      context: .
      dockerfile: containers/e2e/Containerfile
    image: localhost/${PRODUCT:?}-e2e:dev
    container_name: ${PRODUCT:?}-mcp-browser
    profiles: [local]
    command: ["sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    networks: [mcp-edge]
    volumes:
      - trust:/trust:ro

  openbao:
    image: docker.io/openbao/openbao@sha256:a36ea8c27f0dcff5757664ad080425f96d3b6b2f33db3e76c4e2d3112fb17005 # 2.7.1
    container_name: ${PRODUCT:?}-openbao
    depends_on:
      certs:
        condition: service_completed_successfully
    # Starts as root to create its audit log directory on the shared log
    # volume and to rotate the file; OpenBao runs as `openbao` (ADR 0021,
    # 0023). The image's own user is `openbao`.
    entrypoint: ["/bin/sh", "/openbao/entrypoint.sh"]
    command: ["server", "-config=/openbao/config/server.hcl"]
    user: root
    environment:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/entrypoint.sh:/openbao/entrypoint.sh:ro,Z
      - ./containers/openbao/server.hcl:/openbao/config/server.hcl:ro,Z
      - logs:/var/log/app
      - openbao-data:/openbao/data
      - tls-openbao:/openbao/tls:ro
      - trust:/openbao/trust:ro

  api-agent:
    image: docker.io/openbao/openbao@sha256:a36ea8c27f0dcff5757664ad080425f96d3b6b2f33db3e76c4e2d3112fb17005 # 2.7.1
    container_name: ${PRODUCT:?}-api-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    # Owner of the rendered files; the api reads them through group 1000.
    user: "100:1000"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/api.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/api.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - api-secrets:/run/secrets
      - api-agent-cred:/run/agent

  postgres-agent:
