        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:3900"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/s3.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/s3.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - s3-secrets:/run/secrets
      - s3-agent-cred:/run/agent

  backup-agent:
    image: docker.io/openbao/openbao@sha256:a36ea8c27f0dcff5757664ad080425f96d3b6b2f33db3e76c4e2d3112fb17005 # 2.7.1
    container_name: ${PRODUCT:?}-backup-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:1100"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/backup.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/backup.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - backup-secrets:/run/secrets
      - backup-agent-cred:/run/agent

  netbox-agent:
    image: docker.io/openbao/openbao@sha256:a36ea8c27f0dcff5757664ad080425f96d3b6b2f33db3e76c4e2d3112fb17005 # 2.7.1
    container_name: ${PRODUCT:?}-netbox-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    # NetBox runs as 999 in group 0 (root), as upstream does.
    user: "100:0"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/netbox.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/netbox.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - netbox-secrets:/run/secrets
      - netbox-agent-cred:/run/agent

  # --- observability (ADR 0021, 0022) ---------------------------------------
  # TLS on every hop, each listener with its own leaf at /tls; CPU and
  # memory are capped so monitoring cannot starve the application.

  prometheus:
    image: docker.io/prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e # v3.15.0
    container_name: ${PRODUCT:?}-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/observability/web-config.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
    environment:
      ENVIRONMENT: local
    mem_limit: 1g
    cpus: 1.0
    networks: [observability]
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./containers/prometheus/targets:/etc/prometheus/targets:ro,Z
      - ./containers/observability/web-config.yml:/etc/observability/web-config.yml:ro,Z
      - prometheus-data:/prometheus
      - tls-prometheus:/tls:ro
      - trust:/trust:ro

  loki:
    image: docker.io/grafana/loki@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193 # 3.7.8
    container_name: ${PRODUCT:?}-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    mem_limit: 1g
    cpus: 1.0
    networks: [observability]
    volumes:
      - ./containers/loki/loki.yaml:/etc/loki/loki.yaml:ro,Z
      - loki-data:/loki
      - tls-loki:/tls:ro

  # The log shipper. Root inside its rootless container, which is the host
  # user: only that user may read the user journal Podman logs to.
  alloy:
    image: docker.io/grafana/alloy@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f # v1.20.1
    container_name: ${PRODUCT:?}-alloy
    # Stopped before Loki, so the lines it still holds are shipped rather
    # than retried until Podman's SIGKILL: by systemd through this ordering
    # in production, and by scripts/stack.sh locally, because podman-compose
    # stops everything at once on `down`. An order without a binding, so a
    # restart of Loki leaves Alloy running (ADR 0002).
    depends_on:
      loki:
        condition: service_started
        required: false
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - --disable-reporting
    environment:
      ENVIRONMENT: local
    networks: [observability]
    volumes:
      - ./containers/alloy/config.alloy:/etc/alloy/config.alloy:ro,Z
      - logs:/var/log/app:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
      - trust:/trust:ro

  grafana:
    image: docker.io/grafana/grafana@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572 # 13.2.3
    container_name: ${PRODUCT:?}-grafana
    environment:
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /tls/tls.crt
      GF_SERVER_CERT_KEY: /tls/tls.key
      GF_SERVER_ROOT_URL: https://grafana.${PRODUCT:?}.localhost:${PRODUCT_HTTPS_PORT:?}/
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/admin_password
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/secret_key
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # The CA root beside the system roots: Prometheus, Loki and Mailpit
      # locally, a public relay in production.
      SSL_CERT_DIR: /etc/ssl/certs:/trust
      # No SMTP login: the university relay accepts mail by the sender's
      # host name, without authentication (ADR 0022); TLS is mandatory.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mail:1025
      GF_SMTP_FROM_ADDRESS: grafana@app.${PRODUCT:?}.localhost
      GF_SMTP_FROM_NAME: ${PRODUCT_DISPLAY_NAME:?} alerts
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      # Plain text only: Grafana's HTML template loads its font from Google
      # (against ADR 0001) and uses markup many mail clients render only in
      # part; its text template carries the same alert, links and labels.
      GF_EMAILS_CONTENT_TYPES: text/plain
      # Deployment configuration (ADR 0022); may be a distribution list.
      ALERT_EMAIL: operators@app.${PRODUCT:?}.localhost
      # Alertmanager's grouping times, short here so `stack.sh alerts` is
      # quick; scripts/quadlet.sh writes production's 30s and 5m (ADR 0022).
      ALERT_GROUP_WAIT: ${ALERT_GROUP_WAIT:-5s}
      ALERT_GROUP_INTERVAL: ${ALERT_GROUP_INTERVAL:-30s}
    mem_limit: 512m
    cpus: 1.0
    networks: [observability, grafana-edge]
    volumes:
      - ./containers/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./containers/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana-data:/var/lib/grafana
      - grafana-secrets:/run/secrets:ro
      - tls-grafana:/tls:ro
      - trust:/trust:ro

  # SMTP capture locally and in CI; the university relay in production.
  mail:
    image: docker.io/axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d # v1.31.3
    container_name: ${PRODUCT:?}-mail
    profiles: [local]
    user: "65534:65534"
    command:
      - --smtp=0.0.0.0:1025
      - --smtp-tls-cert=/tls/tls.crt
      - --smtp-tls-key=/tls/tls.key
      - --smtp-require-starttls
      - --listen=0.0.0.0:8025
      - --ui-tls-cert=/tls/tls.crt
      - --ui-tls-key=/tls/tls.key
      - --disable-version-check
    networks: [observability, mail-edge]
    volumes:
      - tls-mail:/tls:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e # v0.20.1
    container_name: ${PRODUCT:?}-postgres-exporter
    depends_on:
      postgres:
        condition: service_started
        required: false
    command: ["--web.config.file=/etc/observability/web-config.yml"]
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=verify-full&sslrootcert=/trust/ca.crt
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS_FILE: /run/secrets/database_password
    networks: [db, observability]
    volumes:
      - ./containers/observability/web-config.yml:/etc/observability/web-config.yml:ro,Z
      - postgres-exporter-secrets:/run/secrets:ro
      - tls-postgres-exporter:/tls:ro
      - trust:/trust:ro

  pgbouncer-exporter:
    image: quay.io/prometheuscommunity/pgbouncer-exporter@sha256:30f31b6c2efdad3647f8182cc7c1a3a19e42bae5d17387694989f969371c230d # v0.12.1
    container_name: ${PRODUCT:?}-pgbouncer-exporter
    depends_on:
      pgbouncer:
        condition: service_started
        required: false
    # The password goes into the connection string through the environment,
    # never onto the command line.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        PGBOUNCER_EXPORTER_CONNECTION_STRING="postgres://stats:$$(cat /run/secrets/database_password)@pgbouncer:6432/pgbouncer?sslmode=verify-full&sslrootcert=/trust/ca.crt"
        exec /bin/pgbouncer_exporter --web.config.file=/etc/observability/web-config.yml
    networks: [db, observability]
    volumes:
      - ./containers/observability/web-config.yml:/etc/observability/web-config.yml:ro,Z
      - pgbouncer-exporter-secrets:/run/secrets:ro
      - tls-pgbouncer-exporter:/tls:ro
      - trust:/trust:ro

  valkey-exporter:
    image: docker.io/oliver006/redis_exporter@sha256:6ca518a72f30f7f576ef92963de1b91d3c3f5fd3aeac949f878bfda183587820 # v1.93.0
    container_name: ${PRODUCT:?}-valkey-exporter
    depends_on:
      valkey:
        condition: service_started
        required: false
    command:
      - --redis.addr=rediss://valkey:6379
      - --redis.user=exporter
      - --redis.password-file=/run/secrets/passwords.json
      - --tls-ca-cert-file=/trust/ca.crt
      - --tls-server-cert-file=/tls/tls.crt
      - --tls-server-key-file=/tls/tls.key
    networks: [app-data, observability]
    volumes:
      - valkey-exporter-secrets:/run/secrets:ro
      - tls-valkey-exporter:/tls:ro
      - trust:/trust:ro

  # Host CPU, memory and filesystems, read through the host's root.
  node-exporter:
    image: quay.io/prometheus/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0 # v1.12.1
    container_name: ${PRODUCT:?}-node-exporter
    command:
      - --path.rootfs=/host
      - --web.config.file=/etc/observability/web-config.yml
      # The defaults, plus /run: runtime tmpfs and removable media
      # automounts, never a data, log or backup volume.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    pid: host
    networks: [observability]
    volumes:
      - ./containers/observability/web-config.yml:/etc/observability/web-config.yml:ro,Z
      - /:/host:ro
      - tls-node-exporter:/tls:ro

  # The uptime check (ADR 0022), probing the public endpoint through Nginx.
  # In production it must run on another machine.
  blackbox:
    image: quay.io/prometheus/blackbox-exporter@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc # v0.28.0
    container_name: ${PRODUCT:?}-blackbox
    user: "65534:65534"
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.config.file=/etc/observability/web-config.yml
    networks: [edge, observability]
    volumes:
      - ./containers/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro,Z
      - ./containers/observability/web-config.yml:/etc/observability/web-config.yml:ro,Z
      - tls-blackbox:/tls:ro
      - trust:/trust:ro

  grafana-agent:
    image: docker.io/openbao/openbao@sha256:a36ea8c27f0dcff5757664ad080425f96d3b6b2f33db3e76c4e2d3112fb17005 # 2.7.1
    container_name: ${PRODUCT:?}-grafana-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:0"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/grafana.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/grafana.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - grafana-secrets:/run/secrets
      - grafana-agent-cred:/run/agent

  postgres-exporter-agent:
    image: docker.io/openbao/openbao@sha256:a36ea8c27f0dcff5757664ad080425f96d3b6b2f33db3e76c4e2d3112fb17005 # 2.7.1
    container_name: ${PRODUCT:?}-postgres-exporter-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:65534"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/postgres-exporter.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/postgres-exporter.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - postgres-exporter-secrets:/run/secrets
      - postgres-exporter-agent-cred:/run/agent

  pgbouncer-exporter-agent:
    image: docker.io/openbao/openbao@sha256:a36ea8c27f0dcff5757664ad080425f96d3b6b2f33db3e76c4e2d3112fb17005 # 2.7.1
    container_name: ${PRODUCT:?}-pgbouncer-exporter-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:65534"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/pgbouncer-exporter.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/pgbouncer-exporter.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - pgbouncer-exporter-secrets:/run/secrets
      - pgbouncer-exporter-agent-cred:/run/agent

  valkey-exporter-agent:
    image: docker.io/openbao/openbao@sha256:a36ea8c27f0dcff5757664ad080425f96d3b6b2f33db3e76c4e2d3112fb17005 # 2.7.1
    container_name: ${PRODUCT:?}-valkey-exporter-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:59000"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/valkey-exporter.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/valkey-exporter.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - valkey-exporter-secrets:/run/secrets
      - valkey-exporter-agent-cred:/run/agent

networks:
  edge: {}
  idp-edge: {}
  dozzle-edge: {}
  app-data: {}
  db: {}
  object: {}
  identity: {}
  secrets: {}
  observability: {}
  grafana-edge: {}
  mail-edge: {}
  # NetBox (ADR 0031): browsers through Nginx, the api's REST calls, and
  # NetBox's own database and Valkey access.
  netbox-edge: {}
  netbox-api: {}
  netbox-data: {}
  # No route out of the host (ADR 0026).
  mcp-edge:
    internal: true

volumes:
  certs-ca: {}
  trust: {}
  tls-nginx: {}
  tls-openbao: {}
  tls-postgres: {}
  tls-pgbouncer: {}
  tls-ldap: {}
  tls-valkey: {}
  tls-s3: {}
  tls-api: {}
  tls-worker: {}
  tls-prometheus: {}
  tls-loki: {}
  tls-grafana: {}
  tls-mail: {}
  tls-blackbox: {}
  tls-postgres-exporter: {}
  tls-pgbouncer-exporter: {}
  tls-valkey-exporter: {}
  tls-node-exporter: {}
  tls-netbox: {}
  prometheus-data: {}
  loki-data: {}
  alloy-data: {}
  grafana-data: {}
  openbao-data: {}
  postgres-data: {}
  ldap-data: {}
  idp-data: {}
  valkey-data: {}
  s3-data: {}
  # NetBox's uploaded images and attachments (ADR 0031), written by uid 999.
  netbox-media:
    driver: local
    driver_opts: { o: "uid=999,gid=0" }
  # The backup target locally (ADR 0017); BACKUP_TARGET replaces it with a
  # host directory, the NFS mount in CI.
  backups:
    driver: local
    driver_opts: { o: "uid=1100,gid=1100" }
  # The backup service's own: the bucket mirror, staged files, restic's cache.
  backup-data:
    driver: local
    driver_opts: { o: "uid=1100,gid=1100" }
  # JSON log files of the api and the worker (ADR 0021), written by uid 1000.
  logs:
    driver: local
    driver_opts: { o: "uid=1000,gid=1000" }
  # Secret delivery (ADR 0023): tmpfs only. <service>-secrets is shared with
  # the service; <service>-agent-cred holds the agent's secret_id and is seen
  # by the agent alone.
  api-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0750" }
  api-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0700" }
  postgres-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=70,mode=0750" }
  postgres-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=70,mode=0700" }
  pgbouncer-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=101,mode=0750" }
  pgbouncer-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=101,mode=0700" }
  migrate-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0750" }
  migrate-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0700" }
  test-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0750" }
  test-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0700" }
  ldap-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=101,mode=0750" }
  ldap-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=101,mode=0700" }
  valkey-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0750" }
  valkey-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0700" }
  idp-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=0,mode=0750" }
  idp-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=0,mode=0700" }
  worker-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0750" }
  worker-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0700" }
  s3-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=3900,mode=0750" }
  s3-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=3900,mode=0700" }
  grafana-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=0,mode=0750" }
  grafana-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=0,mode=0700" }
  postgres-exporter-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=65534,mode=0750" }
  postgres-exporter-agent-cred:
    driver: local
