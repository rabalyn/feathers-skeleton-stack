# Single source of the service topology (ADR 0001). Quadlet units under
# deploy/quadlet/ are generated from this file with scripts/quadlet.sh.
#
# Conventions this file keeps so the generated units work:
# - every service sets container_name, because Quadlet otherwise names
#   containers systemd-<name> and service-name DNS stops resolving;
# - no restart policies: they are production drop-ins (ADR 0001);
# - `build:` is local only and is stripped before generation;
# - third-party images are pinned by digest alone (podlet rejects tag@digest),
#   with the version in a trailing comment;
# - depends_on is always written in map form;
# - services whose production counterpart is external or different (ADR
#   0001, 0002) carry the `local` profile, test runners the `test` profile.
#   Neither reaches the generated units, and scripts/stack.sh always runs
#   with --profile local;
# - the `dev` profile holds the Vite dev server (ADR 0014), started by
#   `scripts/stack.sh up --dev`, which also sets NGINX_WEB_UPSTREAM. Values
#   interpolated from the environment are local-only by the same rule and
#   are dropped from the generated units.
name: feathers

services:
  certs:
    build:
      context: .
      dockerfile: containers/certs/Containerfile
    image: localhost/feathers-certs:dev
    container_name: certs
    profiles: [local]
    environment:
      CERT_HOSTNAMES: app.localhost,idp.localhost,dozzle.localhost
    network_mode: none
    volumes:
      - certs-ca:/ca
      - trust:/trust
      - tls-nginx:/tls/nginx
      - tls-openbao:/tls/openbao
      - tls-postgres:/tls/postgres
      - tls-pgbouncer:/tls/pgbouncer
      - tls-ldap:/tls/ldap
      - tls-valkey:/tls/valkey

  nginx:
    build:
      context: .
      dockerfile: containers/nginx/Containerfile
    image: localhost/feathers-nginx:dev
    container_name: nginx
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_TLS_DIR: /etc/nginx/tls
      NGINX_APP_HOST: app.localhost
      NGINX_IDP_HOST: idp.localhost
      NGINX_PUBLIC_PORT: "8443"
      # Mirrored in bytes as the api's BODY_SIZE_CEILING_BYTES (ADR 0025).
      NGINX_BODY_SIZE_LIMIT: 10m
      NGINX_API_UPSTREAM: api:3030
      NGINX_IDP_UPSTREAM: idp:8080
      NGINX_DOZZLE_HOST: dozzle.localhost
      NGINX_DOZZLE_UPSTREAM: dozzle:8080
      # Empty: serve the built bundle. `up --dev`: the dev server.
      NGINX_WEB_UPSTREAM: ${NGINX_WEB_UPSTREAM:-}
    ports:
      # Nginx listens on the public port itself, so inside the networks
      # nginx:8443 is the same origin a browser uses (the e2e container).
      - "127.0.0.1:8443:8443"
    networks: [edge, idp-edge, dozzle-edge]
    volumes:
      - tls-nginx:/etc/nginx/tls:ro

  # The Vite dev server with the frontend source bind-mounted (ADR 0014).
  # Nginx proxies to it when NGINX_WEB_UPSTREAM is set; origin, TLS and
  # headers stay those of production.
  web:
    build:
      context: .
      dockerfile: containers/nginx/Containerfile
      target: web-dev
    image: localhost/feathers-web-dev:dev
    container_name: web
    profiles: [dev]
    environment:
      PUBLIC_HOST: app.localhost
      PUBLIC_PORT: "8443"
    networks: [edge]
    volumes:
      - ./apps/web/src:/repo/apps/web/src:ro,Z
      - ./apps/web/public:/repo/apps/web/public:ro,Z
      - ./apps/web/index.html:/repo/apps/web/index.html:ro,Z
      - ./apps/web/quasar.config.ts:/repo/apps/web/quasar.config.ts:ro,Z

  api:
    build:
      context: .
      dockerfile: containers/api/Containerfile
      target: runtime
    image: localhost/feathers-api:dev
    container_name: api
    # The api refuses to start before migrate has seeded the runtime
    # settings (ADR 0025).
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PUBLIC_ORIGIN: https://app.localhost:8443
      # Rotated JSON log files, read by the collector (ADR 0021).
      LOG_FILE: /var/log/app/api
      AUTH_SIGNING_SECRET_FILE: /run/secrets/auth_signing_secret
      REFRESH_TOKEN_KEY_FILE: /run/secrets/refresh_token_key
      SAML_SP_PRIVATE_KEY_FILE: /run/secrets/saml_sp_key
      SAML_SP_CERTIFICATE_FILE: /run/secrets/saml_sp_cert
      SAML_IDP_CERTIFICATE_FILE: /run/secrets/saml_idp_cert
      SAML_IDP_ENTITY_ID: https://idp.localhost:8443/realms/feathers
      SAML_IDP_SSO_URL: https://idp.localhost:8443/realms/feathers/protocol/saml
      SAML_IDP_SLO_URL: https://idp.localhost:8443/realms/feathers/protocol/saml
      DATABASE_HOST: pgbouncer
      DATABASE_PORT: "6432"
      DATABASE_NAME: app
      DATABASE_USER: app
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_CA_FILE: /trust/ca.crt
      # Nginx's NGINX_BODY_SIZE_LIMIT (10m) in bytes.
      BODY_SIZE_CEILING_BYTES: "10485760"
      VALKEY_HOST: valkey
      VALKEY_USER: api
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      VALKEY_CA_FILE: /trust/ca.crt
      # X-Forwarded-For is believed only from this container (ADR 0016).
      TRUSTED_PROXY_HOST: nginx
      # Directory lookup (ADR 0008); the university directory in production.
      LDAP_URL: ldaps://ldap:636
      LDAP_BIND_DN: cn=api,ou=services,dc=feathers,dc=test
      LDAP_BIND_PASSWORD_FILE: /run/secrets/ldap_bind_password
      LDAP_BASE_DN: ou=people,dc=feathers,dc=test
      LDAP_CA_FILE: /trust/ca.crt
    networks: [edge, app-data, identity]
    volumes:
      - api-secrets:/run/secrets:ro
      - trust:/trust:ro
      - logs:/var/log/app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Background jobs (ADR 0024): the api's image, another entry point, and
  # credentials of its own.
  worker:
    image: localhost/feathers-api:dev
    container_name: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/worker.js"]
    environment:
      LOG_FILE: /var/log/app/worker
      DATABASE_HOST: pgbouncer
      DATABASE_PORT: "6432"
      DATABASE_NAME: app
      DATABASE_USER: worker
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_CA_FILE: /trust/ca.crt
      VALKEY_HOST: valkey
      VALKEY_USER: worker
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      VALKEY_CA_FILE: /trust/ca.crt
    networks: [app-data]
    volumes:
      - worker-secrets:/run/secrets:ro
      - trust:/trust:ro
      - logs:/var/log/app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

  migrate:
    image: localhost/feathers-api:dev
    container_name: migrate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: app
      DATABASE_USER: migrator
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_CA_FILE: /trust/ca.crt
    networks: [db]
    volumes:
      - migrate-secrets:/run/secrets:ro
      - trust:/trust:ro

  postgres:
    image: docker.io/library/postgres@sha256:d8703cd7fba306b9fec9268ecedfa8a966846c053036a60e3635791957eb2f66 # 18.6-alpine
    container_name: postgres
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/tls.crt
      - -c
      - ssl_key_file=/tls/tls.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=100
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/superuser_password
      PGDATA: /var/lib/postgresql/data/pgdata
    networks: [db]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-secrets:/run/secrets:ro
      - tls-postgres:/tls:ro
      - ./containers/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,Z
      - ./containers/postgres/initdb:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      # Over TCP, the way clients connect: during first initialisation the
      # image runs a temporary server on the Unix socket only, which a socket
      # probe would report as ready (and systemd trusts this via
      # Notify=healthy).
      test: ["CMD", "gosu", "postgres", "pg_isready", "-q", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    build:
      context: .
      dockerfile: containers/pgbouncer/Containerfile
    image: localhost/feathers-pgbouncer:dev
    container_name: pgbouncer
    depends_on:
      postgres:
        condition: service_started
    networks: [app-data, db]
    volumes:
      - pgbouncer-secrets:/run/secrets:ro
      - tls-pgbouncer:/tls:ro
      - trust:/trust:ro

  valkey:
    image: docker.io/valkey/valkey@sha256:3b83b0b6a598bb390c8186a408a69949772f439548a81c5ea0ab7ccf102c248d # 9.1.2-alpine
    container_name: valkey
    depends_on:
      certs:
        condition: service_completed_successfully
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    networks: [app-data]
    volumes:
      - ./containers/valkey/valkey.conf:/etc/valkey/valkey.conf:ro,Z
      - valkey-data:/data
      - valkey-secrets:/run/secrets:ro
      - tls-valkey:/tls:ro
      - trust:/trust:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/probe_password)\" valkey-cli --user probe --tls --cacert /trust/ca.crt -h valkey ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  test:
    build:
      context: .
      dockerfile: containers/api/Containerfile
      target: test
    image: localhost/feathers-api-test:dev
    container_name: test
    profiles: [test]
    environment:
      DATABASE_HOST: pgbouncer
      DATABASE_PORT: "6432"
      DATABASE_NAME: postgres
      DATABASE_USER: test
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_CA_FILE: /trust/ca.crt
      DATABASE_POOL_MAX: "2"
      VALKEY_HOST: valkey
      VALKEY_USER: test
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      VALKEY_CA_FILE: /trust/ca.crt
      LDAP_URL: ldaps://ldap:636
      LDAP_BIND_DN: cn=api,ou=services,dc=feathers,dc=test
      LDAP_BIND_PASSWORD_FILE: /run/secrets/ldap_bind_password
      LDAP_BASE_DN: ou=people,dc=feathers,dc=test
      LDAP_CA_FILE: /trust/ca.crt
    networks: [app-data, identity]
    volumes:
      - test-secrets:/run/secrets:ro
      - trust:/trust:ro

  ldap:
    build:
      context: .
      dockerfile: containers/ldap/Containerfile
    image: localhost/feathers-ldap:dev
    container_name: ldap
    profiles: [local]
    depends_on:
      certs:
        condition: service_completed_successfully
    networks: [identity]
    volumes:
      - ldap-data:/var/lib/openldap
      - ldap-secrets:/run/secrets:ro
      - tls-ldap:/tls:ro

  idp:
    build:
      context: .
      dockerfile: containers/idp/Containerfile
    image: localhost/feathers-idp:dev
    container_name: idp
    profiles: [local]
    depends_on:
      ldap:
        condition: service_started
    environment:
      KC_HOSTNAME: https://idp.localhost:8443
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_TRUSTSTORE_PATHS: /trust/ca.crt
    networks: [idp-edge, identity]
    volumes:
      - idp-data:/opt/keycloak/data/h2
      - idp-secrets:/run/secrets:ro
      - trust:/trust:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Local convenience only (ADR 0002): a live view of container output at
  # https://dozzle.localhost:8443. Not part of the log pipeline (ADR 0021,
  # 0022), which reads the log files, not container output.
  dozzle:
    image: docker.io/amir20/dozzle@sha256:b1dd6f52417d505f0de6602fbf629cd240cdf59aba4f7c6959169874e727ef8b # v11.1.1
    container_name: dozzle
    profiles: [local]
    environment:
      DOZZLE_FILTER: label=com.docker.compose.project=feathers
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_RELEASE_CHECK_MODE: manual
      DOZZLE_IMAGE_CHECK_MODE: "off"
    networks: [dozzle-edge]
    # The rootless Podman API socket (systemctl --user enable --now
    # podman.socket). A socket cannot be mounted read-only in any useful
    # sense: whoever reaches it controls the user's containers, which is
    # accepted for a local-only tool behind 127.0.0.1. SELinux hosts need
    # the label disabled to connect to it.
    security_opt: [label=disable]
    volumes:
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

  e2e:
    build:
      context: .
      dockerfile: containers/e2e/Containerfile
    image: localhost/feathers-e2e:dev
    container_name: e2e
    profiles: [test]
    environment:
      E2E_APP_ORIGIN: https://app.localhost:8443
      # Chromium resolves *.localhost to loopback; map the public names to
      # nginx instead (ADR 0015).
      E2E_HOST_RESOLVER_RULES: MAP app.localhost nginx, MAP idp.localhost nginx
    # The container networks are IPv4 only. Link-local IPv6 addresses still
    # appear, and settle, just after start; Chromium reports that as a
    # network change and aborts the request in flight (ERR_NETWORK_CHANGED),
    # which failed the first test of a run intermittently.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    networks: [edge, idp-edge]
    volumes:
      - trust:/trust:ro

  openbao:
    image: docker.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4 # 2.7.0
    container_name: openbao
    depends_on:
      certs:
        condition: service_completed_successfully
    entrypoint: ["bao"]
    command: ["server", "-config=/openbao/config/server.hcl"]
    user: "100:1000"
    environment:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/server.hcl:/openbao/config/server.hcl:ro,Z
      - openbao-data:/openbao/data
      - tls-openbao:/openbao/tls:ro
      - trust:/openbao/trust:ro

  api-agent:
    image: docker.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4 # 2.7.0
    container_name: api-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    # Owner of the rendered files; the api reads them through group 1000.
    user: "100:1000"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/api.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/api.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - api-secrets:/run/secrets
      - api-agent-cred:/run/agent

  postgres-agent:
    image: docker.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4 # 2.7.0
    container_name: postgres-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:70"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/postgres.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/postgres.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - postgres-secrets:/run/secrets
      - postgres-agent-cred:/run/agent

  pgbouncer-agent:
    image: docker.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4 # 2.7.0
    container_name: pgbouncer-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:101"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/pgbouncer.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/pgbouncer.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - pgbouncer-secrets:/run/secrets
      - pgbouncer-agent-cred:/run/agent

  migrate-agent:
    image: docker.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4 # 2.7.0
    container_name: migrate-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:1000"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/migrate.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/migrate.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - migrate-secrets:/run/secrets
      - migrate-agent-cred:/run/agent

  test-agent:
    image: docker.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4 # 2.7.0
    container_name: test-agent
    profiles: [test]
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:1000"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/test.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/test.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - test-secrets:/run/secrets
      - test-agent-cred:/run/agent

  valkey-agent:
    image: docker.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4 # 2.7.0
    container_name: valkey-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:1000"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/valkey.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/valkey.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - valkey-secrets:/run/secrets
      - valkey-agent-cred:/run/agent

  ldap-agent:
    image: docker.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4 # 2.7.0
    container_name: ldap-agent
    profiles: [local]
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:101"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/ldap.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/ldap.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - ldap-secrets:/run/secrets
      - ldap-agent-cred:/run/agent

  idp-agent:
    image: docker.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4 # 2.7.0
    container_name: idp-agent
    profiles: [local]
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    user: "100:0"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/idp.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/idp.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - idp-secrets:/run/secrets
      - idp-agent-cred:/run/agent

  worker-agent:
    image: docker.io/openbao/openbao@sha256:6d575d906d70d40b9d789149c8dc09897291c5a1707d4d0ba8a459eaaa94c8c4 # 2.7.0
    container_name: worker-agent
    depends_on:
      openbao:
        condition: service_started
    entrypoint: ["bao"]
    command: ["agent", "-config=/openbao/agent/agent.hcl"]
    # Owner of the rendered files; the worker reads them through group 1000.
    user: "100:1000"
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/trust/ca.crt
    networks: [secrets]
    volumes:
      - ./containers/openbao/agents/worker.hcl:/openbao/agent/agent.hcl:ro,Z
      - ./containers/openbao/agents/worker.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - worker-secrets:/run/secrets
      - worker-agent-cred:/run/agent

networks:
  edge: {}
  idp-edge: {}
  dozzle-edge: {}
  app-data: {}
  db: {}
  identity: {}
  secrets: {}

volumes:
  certs-ca: {}
  trust: {}
  tls-nginx: {}
  tls-openbao: {}
  tls-postgres: {}
  tls-pgbouncer: {}
  tls-ldap: {}
  tls-valkey: {}
  openbao-data: {}
  postgres-data: {}
  ldap-data: {}
  idp-data: {}
  valkey-data: {}
  # JSON log files of the api and the worker (ADR 0021), written by uid 1000.
  logs:
    driver: local
    driver_opts: { o: "uid=1000,gid=1000" }
  # Secret delivery (ADR 0023): tmpfs only. <service>-secrets is shared with
  # the service; <service>-agent-cred holds the agent's secret_id and is seen
  # by the agent alone.
  api-secrets:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0750" }
  api-agent-cred:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,uid=100,gid=1000,mode=0700" }
