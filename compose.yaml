      - ./containers/openbao/agents/postgres.role_id:/openbao/agent/role_id:ro,Z
      - trust:/openbao/trust:ro
      - postgres-secrets:/run/secrets
      - postgres-agent-cred:/run/agent

  pgbouncer-agent:
    image: docker.io/openbao/openbao@sha256:a36ea8c27f0dcff5757664ad080425f96d3b6b2f33db3e76c4e2d3112fb17005 # 2.7.1
    container_name: ${PRODUCT:?}-pgbouncer-agent
