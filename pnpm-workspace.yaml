packages:
  - apps/*
  - packages/*
  - e2e

# Install scripts run only where listed as true (ADR 0018). These two only
# fetch or verify native binaries that already arrive as optional platform
# packages, so they are denied.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  msgpackr-extract: false

# Security floor for transitive dependencies (ADR 0018): the SAML libraries
# pin @xmldom/xmldom ranges that still admit versions with known XML
# injection and DoS flaws. Remove once they require >= 0.8.15 themselves.
#
# @intlify/unplugin-vue-i18n pins esbuild ^0.25, whose binaries are built
# with a Go toolchain carrying critical crypto/tls flaws; it only calls
# esbuild's stable transform API. Remove once it allows a current esbuild.
overrides:
  '@xmldom/xmldom@<0.8.15': 0.8.15
  'esbuild@<0.28.2': 0.28.2

# Accepted pnpm audit findings (ADR 0018), for advisories with no fixed
# version, so no overrides floor is possible. Every entry carries a trailing
# `# until YYYY-MM-DD: <statement>` comment; scripts/ci.sh fails once the date
# has passed, so the finding has to be looked at again.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # until 2026-11-30: braces (no fix released) under @intlify/unplugin-vue-i18n > fast-glob; build-time only, globs our own src/i18n path, never in the web image
