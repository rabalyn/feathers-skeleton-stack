# Valkey (ADR 0010): rate-limit state now, BullMQ queues later.

# TLS only, verified by clients against the local CA root like the database
# hops (ADR 0004). Clients authenticate by password, not certificate.
port 0
tls-port 6379
bind * -::*
tls-cert-file /tls/tls.crt
tls-key-file /tls/tls.key
tls-ca-cert-file /trust/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"

# Persisted to disk: AOF plus periodic RDB snapshots; the snapshot is part of
# the backup (ADR 0017).
dir /data
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000

# Never evict: an evicting policy would silently drop limiter keys and
# queued jobs, and BullMQ requires it. When full, writes fail, and the rate
# limiter refuses attempts (fail closed).
maxmemory 256mb
maxmemory-policy noeviction

# The users and their passwords, rendered by the valkey-agent from OpenBao
# (ADR 0023); the default user is off.
include /run/secrets/valkey-auth.conf
