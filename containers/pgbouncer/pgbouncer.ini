; ADR 0004: all pooled access in transaction mode.
[databases]
; Wildcard route, so per-worker test databases need no change here.
* = host=postgres port=5432

[users]
; Global cap on server connections across every test_w<N> database.
test = max_user_connections=60

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

auth_type = scram-sha-256
; Rendered by pgbouncer-agent (ADR 0023).
auth_file = /run/secrets/userlist.txt

pool_mode = transaction
default_pool_size = 25
max_client_conn = 1000
; Server connections are released after this long idle, so a finished test
; worker's pool does not hold PostgreSQL connections.
server_idle_timeout = 30

; node-postgres sends these; they are harmless under transaction pooling.
ignore_startup_parameters = extra_float_digits,options

logfile =
log_connections = 0
log_disconnections = 0
admin_users =
; The exporter reads SHOW STATS/POOLS from the admin console (ADR 0022).
stats_users = stats

; ADR 0004: TLS on both hops.
client_tls_sslmode = require
client_tls_cert_file = /tls/fullchain.crt
client_tls_key_file = /tls/tls.key
client_tls_protocols = secure
server_tls_sslmode = verify-full
server_tls_ca_file = /trust/ca.crt
server_tls_protocols = secure
