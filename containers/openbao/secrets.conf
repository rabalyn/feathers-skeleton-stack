# Secret manifest (ADR 0023), read by scripts/stack.sh locally and in CI and
# by scripts/openbao-init.sh in production.
#
#   <name> <generator> <service>:<key> [<service>:<key> ...]
#
# A value is generated once and written to every listed target, so services
# that must agree on a value (a database role's password in postgres,
# pgbouncer and the api) get the same one, each under its own path. Targets
# of services that do not run in an environment are skipped there.
# Generators:
#   random  48 url-safe chars, in every environment
#   garage-key-id  an S3 access key id: GK and 24 hex digits (ADR 0020)
#   random-long  96 url-safe chars: NetBox's secret key and token pepper
#   hex32   32 random bytes as 64 hex digits: Garage's RPC secret and keys
#   local   the same locally; in production the value comes from outside
#           (the university's LDAP, the SMTP relay) and an administrator
#           writes it
#   local-only:<generator>
#           that generator, for a local test client; never in production,
#           where the target's template renders nothing
auth_signing_secret  random  api:auth_signing_secret
refresh_token_key    random  api:refresh_token_key
db_superuser_password  random  postgres:superuser_password
db_migrator_password   random  postgres:migrator_password migrate:database_password
db_app_password        random  postgres:app_password pgbouncer:app_password api:database_password
db_test_password       random  postgres:test_password pgbouncer:test_password test:database_password
db_worker_password     random  postgres:worker_password pgbouncer:worker_password worker:database_password
# The backup service's read-only login (ADR 0017), direct to postgres.
db_backup_password     random  postgres:backup_password backup:database_password
# Observability (ADR 0022): the exporters' read-only logins and Grafana's
# admin. SMTP needs no login: the relay accepts mail without authentication.
db_exporter_password   random  postgres:exporter_password postgres-exporter:database_password
pgbouncer_stats_password random pgbouncer:stats_password pgbouncer-exporter:database_password
valkey_exporter_password random valkey:exporter_password valkey-exporter:valkey_password
grafana_admin_password random  grafana:admin_password
grafana_secret_key     random  grafana:secret_key
ldap_admin_password    random  ldap:admin_password
ldap_keycloak_password random  ldap:keycloak_password idp:ldap_bind_password
ldap_api_password      local   ldap:api_password api:ldap_bind_password test:ldap_bind_password
idp_admin_password     random  idp:admin_password
# One Valkey user per client service (ADR 0010); `probe` is the healthcheck.
valkey_probe_password  random  valkey:probe_password
valkey_api_password    random  valkey:api_password api:valkey_password
valkey_worker_password random  valkey:worker_password worker:valkey_password
valkey_test_password   random  valkey:test_password test:valkey_password
# Object storage (ADR 0020): Garage's RPC secret, and one S3 key per client
# service, which the s3 container imports at start.
s3_rpc_secret        hex32          s3:rpc_secret
s3_api_key_id        garage-key-id  s3:api_key_id api:s3_key_id
s3_api_secret_key    hex32          s3:api_secret_key api:s3_secret_key
s3_worker_key_id     garage-key-id  s3:worker_key_id worker:s3_key_id
s3_worker_secret_key hex32          s3:worker_secret_key worker:s3_secret_key
s3_backup_key_id     garage-key-id  s3:backup_key_id backup:s3_key_id
s3_backup_secret_key hex32          s3:backup_secret_key backup:s3_secret_key
# The integration tests' own key (ADR 0015), local only.
s3_test_key_id       local-only:garage-key-id  s3:test_key_id test:s3_key_id
s3_test_secret_key   local-only:hex32          s3:test_secret_key test:s3_secret_key
# NetBox (ADR 0031): its database and Valkey logins, Django's secret key and
# the pepper its v2 API tokens are hashed with (both at least 50 characters),
# and the secret of the api's read-only token.
db_netbox_password     random       postgres:netbox_password pgbouncer:netbox_password netbox:database_password
valkey_netbox_password random       valkey:netbox_password netbox:valkey_password
netbox_secret_key      random-long  netbox:secret_key
netbox_token_pepper    random-long  netbox:api_token_pepper
netbox_api_token       random       netbox:api_token api:netbox_token test:netbox_token
# The restic repositories' password (ADR 0017). Generated, but in
# production also kept offline in the team's KeePass: losing it loses every
# backup. Changed only through restic's key management, never overwritten.
restic_password      random  backup:restic_password
