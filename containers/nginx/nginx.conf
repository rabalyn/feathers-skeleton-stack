worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;
# SIGQUIT, Podman's stop signal for this image, waits for every open
# connection, and a WebSocket stays open until the client leaves: without a
# bound Podman sends SIGKILL after 10 s. Same grace as the API (ADR 0016).
worker_shutdown_timeout 5s;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time "$http_user_agent" $request_id';
  access_log /dev/stdout main;

  sendfile on;
  server_tokens off;
  absolute_redirect off;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  # TLS 1.2 suites: ECDHE with AEAD only, Mozilla's "intermediate" profile.
  # nginx's default list also offers CBC and SHA-1 suites. TLS 1.3 suites are
  # not set here and are all acceptable (ADR 0016).
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

  # A client that sends its headers or body slowly, or reads the response
  # slowly, is dropped after these gaps instead of nginx's 60 s, so idle
  # connections cannot pile up (ADR 0016). Each is the time between two reads
  # or writes, not the whole transfer: an upload or a download of any length
  # keeps going while bytes move. WebSocket and server-sent event streams are
  # bounded by their own proxy_read_timeout.
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 15s;

  # Concurrent requests per client address (each HTTP/2 stream and each open
  # WebSocket counts as one), answered 429 above the bound. Generous because
  # rootless Podman's port publishing makes every local browser one address
  # (ADR 0016); the application's own rate limits stay in the api (ADR 0010).
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_conn perip 256;
  limit_conn_status 429;

  # The upstream's own Referrer-Policy wins when it sends one (Keycloak,
  # NetBox and Mailpit send stricter ones); otherwise ours (base-headers.conf).
  map $upstream_http_referrer_policy $referrer_policy {
    ''      strict-origin-when-cross-origin;
    default '';
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  include /etc/nginx/conf.d/*.conf;
}
