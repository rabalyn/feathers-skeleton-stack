# TLS in front of Garage's unix sockets (ADR 0020). Reachable on the `object`
# network by the api and the worker (S3, :3900) and on `observability` by
# Prometheus (:3903, /metrics and /health only).
worker_processes 1;
pid /run/garage/nginx.pid;
error_log stderr warn;

events {
  worker_connections 512;
}

http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  ssl_certificate /tls/tls.crt;
  ssl_certificate_key /tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  proxy_http_version 1.1;
  proxy_set_header Connection "";

  server {
    listen 3900 ssl;
    # Streamed both ways; object size is the api's to limit (ADR 0020).
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    location / {
      # SigV4 signs the Host header, so it passes unchanged.
      proxy_set_header Host $http_host;
      proxy_pass http://unix:/run/garage/s3.sock;
    }
  }

  server {
    listen 3903 ssl;
    location = /metrics {
      proxy_pass http://unix:/run/garage/admin.sock;
    }
    location = /health {
      proxy_pass http://unix:/run/garage/admin.sock;
    }
    location / {
      return 404;
    }
  }
}
