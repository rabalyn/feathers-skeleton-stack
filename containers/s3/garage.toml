# Garage (ADR 0020): one node, one copy; durability comes from the backup
# (ADR 0017). Both APIs are unix sockets, reached only through the Nginx in
# this container, which adds TLS. RPC stays on loopback: there is no second
# node to talk to, and the CLI inside the container uses it.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/run/secrets/rpc_secret"

[s3_api]
api_bind_addr = "/run/garage/s3.sock"
s3_region = "garage"

# No admin token: the admin API only serves /health and /metrics, and
# administration goes through the CLI over RPC.
[admin]
api_bind_addr = "/run/garage/admin.sock"
