# Alert delivery by email (ADR 0022). The recipient is deployment
# configuration, ALERT_EMAIL in Grafana's environment, and may be a list.
# group_wait and group_interval come from the environment too: 30s and 5m
# in production, shorter locally (compose.yaml).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: operators
    receivers:
      - uid: operators-email
        type: email
        settings:
          addresses: $ALERT_EMAIL
          singleEmail: true

policies:
  - orgId: 1
    receiver: operators
    group_by: [alertname]
    group_wait: $ALERT_GROUP_WAIT
    group_interval: $ALERT_GROUP_INTERVAL
    repeat_interval: 4h
