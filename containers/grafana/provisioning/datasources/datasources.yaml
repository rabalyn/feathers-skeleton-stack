# Provisioned as code (ADR 0022). Both over TLS; Grafana trusts the CA root
# through SSL_CERT_DIR.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: https://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: https://loki:3100
    editable: false
