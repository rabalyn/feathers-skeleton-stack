# Accepted image vulnerability findings (ADR 0018). Every entry names the
# image it belongs to, says why it is accepted, and expires: after
# `expired_at` it blocks the gate again and has to be looked at.
vulnerabilities:
  # Keycloak 26.7.4 is the local and CI identity provider only (ADR 0008);
  # it never runs in production, where the university IdP is used, and it is
  # the newest release. These are jars Keycloak bundles; they go when a
  # Keycloak release updates them.
  - id: CVE-2026-84939
    purls: ["pkg:maven/org.freemarker/freemarker@2.3.32"]
    statement: "local IdP only (localhost/feathers-idp); fixed in Keycloak's next jar update"
    expired_at: 2026-11-30
  - id: CVE-2026-75595
    purls: ["pkg:maven/io.netty/netty-handler@4.1.136.Final"]
    statement: "local IdP only (localhost/feathers-idp); fixed in Keycloak's next jar update"
    expired_at: 2026-11-30
  - id: CVE-2025-59250
    purls: ["pkg:maven/com.microsoft.sqlserver/mssql-jdbc@13.2.1"]
    statement: "local IdP only (localhost/feathers-idp), which uses its embedded H2 store, never SQL Server"
    expired_at: 2026-11-30
  - id: CVE-2026-8763
    purls: ["pkg:maven/org.bouncycastle/bcprov-jdk18on@1.84"]
    statement: "local IdP only (localhost/feathers-idp), in the admin CLI that stack.sh uses against the local Keycloak"
    expired_at: 2026-11-30
  - id: CVE-2026-13506
    purls: ["pkg:maven/org.bouncycastle/bcprov-jdk18on@1.84"]
    statement: "local IdP only (localhost/feathers-idp), in the admin CLI that stack.sh uses against the local Keycloak"
    expired_at: 2026-11-30
  # Dozzle v11.1.1 (newest) is a local-only log viewer (ADR 0002), never
  # deployed, reachable only through Nginx on the developer's machine.
  - id: CVE-2026-84445
    purls: ["pkg:golang/google.golang.org/grpc@v1.84.0"]
    statement: "local log viewer only (Dozzle); gone with Dozzle's next release"
    expired_at: 2026-11-30

